[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fastapi-project-template"
description = "FastAPI project template"
authors = [
    { name = "Oleg Korsak", email = "kamikaze.is.waiting.you@gmail.com" }
]
license = "GPL-3.0"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
requires-python = "==3.15.0"
dynamic = ["version"]
dependencies = [
    "aiohttp[speedups]==3.14.5",
    "alembic==1.20.0",
    "alembic-postgresql-enum==1.11.0",
    "alembic_utils==0.8.8",
    "asyncpg==0.32.0",
    "Authlib==1.9.1",
    "certifi==2026.10.19",
    "fastapi-commons==0.10.0",
    "fastapi-pagination==0.16.1",
    "fastapi==0.156.0",
    "granian==2.8.5; platform_system == 'Windows'",
    "granian[uvloop]==2.8.5; platform_system != 'Windows'",
    "msgpack==1.2.3",
    "passlib[argon2]==1.7.4",
    "pwdlib==0.3.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyJWT==2.15.1",
    "python-dateutil==2.9.0.post0",
    "python3-commons[authn,authz,database]==0.27.0",
    "scalar-fastapi==1.9.1",
    "SQLAlchemy[asyncio]==2.1.5",
    "starlette==1.9.0",
    "uvloop==0.23.0; platform_system != 'Windows'",
]

[project.urls]
"Homepage" = "https://github.com/kamikaze/fastapi-project-template"
"Documentation" = "https://github.com/kamikaze/fastapi-project-template/wiki"

[dependency-groups]
dev = [
    "pip",
    "pre-commit",
    "pyright",
    "ruff",
    "ty",
]
testing = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.maturin]
python-source = "src"
module-name = "fastapi_project_template._ext"
features = ["pyo3/extension-module"]

[tool.bdist_wheel]
universal = true

[tool.devpi.upload]
no-vcs = true
formats = ["bdist_wheel"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py315"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "TC001",
    "TC002",
    "TC003", # issues with msgspec.Struct subclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
exclude = ["*.pyi"]
indent-style = "space"
quote-style = "single"

[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
reportMatchNotExhaustive = "error"
reportUnnecessaryComparison = "error"
reportMissingModuleSource = false
#strict = ["src"]

[tool.ty.rules]
unknown-argument = "ignore"  # false positives for Pydantic model fields

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov fastapi_project_template --cov-fail-under=0 --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]
