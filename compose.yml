name: fastapi-project-template

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: [ "dex", "serve", "/etc/dex/config.yaml" ]
    volumes:
      - ./.docker/dex/config.yaml:/etc/dex/config.yaml:ro,Z
    restart: unless-stopped
    ports:
      - "5556:5556"
    networks:
      common:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    volumes:
      - azurite-data:/data
    command: [ "azurite-blob", "--blobHost", "0.0.0.0" ]
    ports:
      - "10000:10000"

  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-GK0123456789abcdef01234567}"
      GARAGE_DEFAULT_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      GARAGE_DEFAULT_BUCKET: "${S3_BUCKET:-test}"
    healthcheck:
      test: [ "CMD", "/garage", "health", "-q" ]
      interval: 3s
      timeout: 10s
      retries: 5
    volumes:
      - ./.docker/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      common:
        aliases:
          - garage

  rabbitmq:
    image: docker.io/library/rabbitmq:4.4.0-management
    environment:
      RABBITMQ_ERLANG_COOKIE: 'secret_cookie'
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./.docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro,Z
      - ./.docker/rabbitmq/init.sh:/init.sh:ro,Z
      - rabbitmq_data:/var/lib/rabbitmq
    command: [ "bash", "-c", "/init.sh" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      common:

  valkey:
    image: docker.io/valkey/valkey:9.1.3-alpine
    command:
      - /bin/sh
      - -c
      - valkey-server --requirepass "$${VALKEY_PASSWORD}"
    ports:
      - "6379:6379"
    environment:
      VALKEY_REPLICATION_MODE: "master"
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:-dev}"
    networks:
      common:

  opa:
    image: docker.io/openpolicyagent/opa:1.22.0
    ports:
      - "8181:8181"
    volumes:
      - ./.docker/opa/policies:/policies:ro
    command:
      - run
      - --server
      - --log-level
      - debug
      - --addr=0.0.0.0:8181
      - /policies
    networks:
      common:

  db:
    image: docker.io/library/postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-template_app_db}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dev}"
      POSTGRES_USER: "${POSTGRES_USER:-dev}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h $$(hostname -i)" ]
      start_period: 3s
      interval: 3s
      timeout: 15s
      retries: 10
    volumes:
      - db:/var/lib/postgresql/18
    networks:
      common:

  db-migrate:
    build:
      context: ./
      dockerfile: Containerfile
    image: localhost/fastapi-project-template
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_DSN: "postgresql+asyncpg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-template_app_db}"
      LOGGING_LEVEL: "${LOGGING_LEVEL:-DEBUG}"
    entrypoint: python3
    command: [ "-m", "alembic", "upgrade", "head" ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      common:

  react-template:
    image: ghcr.io/kamikaze/react-project-template:v0.0.11
    ports:
      - "5173:8080"
    depends_on:
      dex:
        condition: service_started
    networks:
      common:

  fastapi-project-template:
    build:
      context: ./
      dockerfile: Containerfile
    image: localhost/fastapi-project-template
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8080"
    environment:
      DB_DSN: "postgresql+asyncpg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-template_app_db}"
      LOGGING_LEVEL: "${LOGGING_LEVEL:-DEBUG}"
      LOGGING_FORMATTER: "${LOGGING_FORMATTER:-json}"
      OBJECT_STORAGE_WORK_PATH: "${OBJECT_STORAGE_WORK_PATH:-s3://test}"
      AWS_ENDPOINT_URL_S3: "${AWS_ENDPOINT_URL_S3:-http://garage:3900}"
      S3_REGION: "${S3_REGION:-lv-riga-1}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-path}"
      S3_ALLOW_HTTP: "${S3_ALLOW_HTTP:-true}"
      S3_CERT_VERIFY: "${S3_CERT_VERIFY:-false}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-GK0123456789abcdef01234567}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      VALKEY_DSN: "redis://:${VALKEY_PASSWORD:-dev}@valkey:6379/0"
      API_AUTH_ENABLED: "${API_AUTH_ENABLED:-false}"
      OIDC_AUTHORITY_URL: "http://localhost:5556/dex"
      OIDC_AUTHORITY_INTERNAL_HOST: "http://dex:5556/"
      OIDC_CLIENT_ID: "frontend"
      OIDC_AUDIENCE: "frontend"
      OIDC_REDIRECT_URI: "http://localhost:5173/"
      OIDC_SCOPE: "openid,profile,email,groups"
      OPA_URL: "${OPA_URL:-http://opa:8181/v1/data/app/authz}"
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_started
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_started
      dex:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      common:

volumes:
  db:
  azurite-data:
  garage-meta:
  garage-data:
  rabbitmq_data:

networks:
  common:
    driver: bridge
